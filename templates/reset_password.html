<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-box">
        <h2>Reset Password 🔑</h2>
        <p class="subtitle">Enter your username and a new password.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px;">
              {% for message in messages %}{{ message }}{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required class="form-control" placeholder="Your account username">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required class="form-control" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 12px;">Update Password</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.85rem;">
            <p><a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Return to Login</a></p>
        </div>
    </div>
</body>
</html>
