<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-box">
        <h2>Join YouthVoice 🚀</h2>
        <p class="subtitle">Create an account to submit ideas & vote.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px;">
              {% for message in messages %}{{ message }}{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required class="form-control" placeholder="Choose a unique handle">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 12px;">Create Account</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
            <p>Already a member? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Login here</a></p>
            <p style="margin-top: 12px;"><a href="{{ url_for('index') }}" style="color: #94a3b8; text-decoration: none;">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
