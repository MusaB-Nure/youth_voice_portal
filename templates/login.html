<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Login - YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-box">
        <h2>Welcome Back ⚡</h2>
        <p class="subtitle">Log in to access your youth club dashboard.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px;">
              {% for message in messages %}{{ message }}{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required class="form-control" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 12px;">Sign In</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
            <p><a href="{{ url_for('reset_password') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot password?</a></p>
            <p style="margin-top: 8px;">Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register here</a></p>
            <p style="margin-top: 12px;"><a href="{{ url_for('index') }}" style="color: #94a3b8; text-decoration: none;">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
