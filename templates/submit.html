<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Concern - YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 500px; margin: auto; padding: 20px;">
        <h2>Submit a Community Concern</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul style="color: red; list-style-type: none; padding: 0;">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('submit') }}">
            <div style="margin-bottom: 15px;">
                <label><strong>Issue Title:</strong></label><br>
                <input type="text" name="title" required placeholder="e.g., Limited access to study space" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label><strong>Category:</strong></label><br>
                <select name="category" style="width: 100%; padding: 8px; margin-top: 5px;">
                    <option value="Education & Resources">Education & Resources</option>
                    <option value="Environment & Community">Environment & Community</option>
                    <option value="Sports & Youth Events">Sports & Youth Events</option>
                    <option value="General Initiative">General Initiative</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label><strong>Description & Details:</strong></label><br>
                <textarea name="description" required rows="5" placeholder="Describe the problem and who it affects..." style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
            </div>

            <button type="submit" style="padding: 10px 20px; cursor: pointer; background-color: #3b7a78; color: white; border: none; border-radius: 4px; width: 100%;">Submit Issue</button>
        </form>
        <p style="margin-top: 15px;"><a href="{{ url_for('index') }}">← Back to Dashboard</a></p>
    </div>
</body>
</html>
