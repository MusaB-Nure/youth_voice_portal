<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit an Issue - YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>YouthVoice Portal</h1>
            <p>Share a challenge affecting young people in your community.</p>
            <nav>
                <a href="/">Dashboard & Priorities</a>
                <a href="/submit" class="active btn-nav">Submit New Issue</a>
            </nav>
        </div>
    </header>

    <main class="container form-container">
        <h2>Submit a Community Concern</h2>
        <form id="issue-form">
            <div class="form-group">
                <label for="title">Issue Title:</label>
                <input type="text" id="title" required placeholder="e.g., Limited access to study space">
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="Education">Education & Resources</option>
                    <option value="Environment">Environment & Cleanliness</option>
                    <option value="Inclusion">Inclusion & Accessibility</option>
                    <option value="Public Speaking">Youth Participation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description & Details:</label>
                <textarea id="description" rows="5" required placeholder="Describe the problem and who it affects..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Issue</button>
        </form>
        <p id="response-message"></p>
    </main>

    <script>
        document.getElementById('issue-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;

            const response = await fetch('/api/issues', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, description })
            });

            if (response.ok) {
                document.getElementById('response-message').innerHTML = "✅ Issue submitted successfully! Redirecting...";
                setTimeout(() => window.location.href = '/', 1500);
            } else {
                document.getElementById('response-message').innerHTML = "❌ Error submitting issue. Try again.";
            }
        });
    </script>
</body>
</html>
