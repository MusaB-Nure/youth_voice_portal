<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Initiative - YouthVoice Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="auth-box" style="max-width: 500px; width: 100%;">
        <h2>Submit a Community Initiative 💡</h2>
        <p class="subtitle">Share a challenge or proposal for your youth club to tackle.</p>

        <form method="POST">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required class="form-control" placeholder="e.g., Neighborhood Recycling Drive">
            </div>
            
            <div class="form-group">
                <label>Category Tag</label>
                <select name="category" class="form-control" style="cursor: pointer;">
                    <option value="Environment">🌱 Environment</option>
                    <option value="Education">📚 Education & Skills</option>
                    <option value="Technology">💻 Technology & Innovation</option>
                    <option value="Community">🤝 Community Welfare</option>
                    <option value="Sports">⚽ Sports & Recreation</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" required class="form-control" rows="4" placeholder="Describe the issue and proposed solution in detail..."></textarea>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 12px; margin-top: 10px;">Publish to Dashboard</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('index') }}" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
